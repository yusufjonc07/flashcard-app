plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'flashcards'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// JavaFX ships a separate jar per operating system and CPU.
def osName = System.getProperty('os.name').toLowerCase()
def arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
ext.javafxPlatform = osName.contains('mac') ? (arm ? 'mac-aarch64' : 'mac')
        : osName.contains('win') ? 'win'
        : (arm ? 'linux-aarch64' : 'linux')

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Web pages (Spring MVC + Thymeleaf) and database access (JdbcTemplate + SQLite)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    // Bootstrap 5 and its icons, served by the app itself from /webjars/** (works offline)
    implementation 'org.webjars:bootstrap:5.3.3'
    implementation 'org.webjars.npm:bootstrap-icons:1.11.3'

    // Document reading, OCR, Korean tokenising, JSON
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.poi:poi-scratchpad:5.4.1'
    implementation 'net.sourceforge.tess4j:tess4j:5.20.0'
    implementation 'org.openkoreantext:open-korean-text:2.3.1'
    implementation 'com.google.code.gson:gson:2.14.0'

    // Desktop window (JavaFX WebView) for the packaged app, see desktop/DesktopApp.java
    ['base', 'graphics', 'controls', 'media', 'web'].each {
        implementation "org.openjfx:javafx-${it}:25.0.1:${javafxPlatform}"
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'   // sqlite-jdbc loads a native library
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

// Run from the project folder so data/ and tessdata/ resolve.
tasks.named('bootRun') {
    workingDir = projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// ---- Desktop app -------------------------------------------------------------------------
// ./gradlew desktopApp   -> build/desktop/Flashcards.app (macOS) with its own Java runtime
// ./gradlew desktopDmg   -> build/desktop/Flashcards-1.0.0.dmg installer

def desktopInput = layout.buildDirectory.dir('desktop/input')
def desktopOut = layout.buildDirectory.dir('desktop')

tasks.register('desktopInput', Sync) {
    description = 'Collects the app jar, its libraries and the OCR data for jpackage.'
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath)
    into desktopInput
    into('tessdata') { from 'tessdata' }
}

def jpackageTask = { String name, String type ->
    tasks.register(name, Exec) {
        group = 'distribution'
        description = "Packages the desktop app (${type}) with jpackage."
        dependsOn 'desktopInput'
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        doFirst {
            def out = desktopOut.get().asFile
            // jpackage refuses to overwrite, so remove the previous output of this type
            if (type == 'app-image') {
                new File(out, 'Flashcards.app').deleteDir()
            } else {
                fileTree(out) { include "*.${type}" }.each { it.delete() }
            }
            def jpackage = new File(launcher.get().metadata.installationPath.asFile, 'bin/jpackage')
            def jarName = tasks.named('jar').get().archiveFileName.get()
            def cmd = [jpackage.path,
                       '--type', type,
                       '--name', 'Flashcards',
                       '--app-version', project.version.toString(),
                       '--vendor', 'Gachon University student project',
                       '--input', desktopInput.get().asFile.path,
                       '--main-jar', jarName,
                       '--main-class', 'flashcards.desktop.DesktopMain',
                       '--dest', out.path,
                       '--java-options', '--enable-native-access=ALL-UNNAMED',
                       '--java-options', '-Dflashcards.tessdata=$APPDIR/tessdata',
                       '--java-options', '-Xmx2g']
            def icon = file('packaging/Flashcards.icns')
            if (osName.contains('mac') && icon.exists()) {
                cmd += ['--icon', icon.path, '--mac-package-name', 'Flashcards']
            }
            commandLine cmd
        }
    }
}
jpackageTask('desktopApp', 'app-image')
jpackageTask('desktopDmg', osName.contains('mac') ? 'dmg' : (osName.contains('win') ? 'msi' : 'deb'))
