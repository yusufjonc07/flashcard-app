<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Read ' + ${set.name()})}"></head>
<body class="bg-body-tertiary">
<th:block th:with="fluid=true"><nav th:replace="~{layout :: header}"></nav></th:block>
<main class="container-fluid px-md-4 pb-5">
    <div th:replace="~{layout :: flash}"></div>


    <!-- The word list starts hidden; "words-hidden" gives the pages the full width.
         Portrait pages are shown two side by side ("spread"), landscape pages one at a time. -->
    <div class="row g-3 align-items-start reader-row words-hidden" id="readerRow">
        <div class="col-12 col-md-8 col-xl-9 reader-page">
            <div class="row g-3" th:classappend="${spread} ? 'spread'">
                <div th:each="pv : ${views}" th:class="${spread} ? 'col-12 col-sm-6' : 'col-12'">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <div class="page-view" th:if="${pv.hasImage()}">
                                <img class="border rounded" th:src="@{/sets/{id}/pages/{n}.png(id=${set.id()},n=${pv.number()})}"
                                     th:alt="'Page ' + ${pv.number()}">
                                <div class="box" th:each="box : ${pv.boxes()}" th:attr="data-word=${box.word()}"
                                     th:classappend="${saved.contains(box.word())} ? 'saved'"
                                     th:style="'left:' + ${box.left()} + ';top:' + ${box.top()} + ';width:' + ${box.width()} + ';height:' + ${box.height()}"></div>
                            </div>
                            <div class="page-text" th:unless="${pv.hasImage()}" th:text="${pv.text()}">text</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4 col-xl-3 sticky-md-top reader-side" id="wordSidebar">
            <div class="card shadow-sm">
                <div class="card-header bg-body">
                    <h2 class="h6 mb-1">
                        Korean words on <span th:text="${spread} ? 'pages ' + ${shownNumbers[0]} + '–' + ${shownNumbers[1]} : 'page ' + ${page.number()}">page 1</span>
                        <span class="badge text-bg-secondary ms-1" id="wordCount" th:text="${wordCount}">0</span>
                        <span class="badge text-bg-success ms-1 d-none" id="savedCount">0 saved</span></h2>
                    <div class="small text-body-secondary" id="status">
                        <span class="spinner-border spinner-border-sm me-1"></span> Loading translations…
                    </div>
                </div>
                <div class="card-body text-body-secondary" th:if="${wordCount == 0}">
                    No Korean words found on this page.
                </div>
                <ul class="list-group list-group-flush word-list">
                    <th:block th:each="pv : ${views}">
                        <li class="list-group-item list-group-item-secondary small fw-semibold py-1"
                            th:if="${spread and !#lists.isEmpty(pv.words())}" th:text="'Page ' + ${pv.number()}">Page 1</li>
                        <li class="list-group-item d-flex justify-content-between align-items-center gap-2 word-item"
                            th:each="word : ${pv.words()}" th:with="isSaved=${saved.contains(word)}"
                            th:attr="data-word=${word},data-saved=${isSaved}">
                            <div class="min-w-0">
                                <div class="word fw-semibold" th:text="${word}">학교</div>
                                <div class="meaning hidden small text-body-secondary" title="Click to reveal">…</div>
                            </div>
                            <button type="button" class="btn btn-sm btn-success save text-nowrap" disabled th:if="${isSaved}">
                                <i class="bi bi-check-lg"></i> Saved</button>
                            <button type="button" class="btn btn-sm btn-outline-primary save text-nowrap" disabled th:unless="${isSaved}">
                                <i class="bi bi-bookmark-plus"></i> Save</button>
                        </li>
                    </th:block>
                </ul>
            </div>
        </div>
    </div>
    <!-- Slide previews: at most 10 thumbnails around the current page, kept at the bottom of the screen. -->
    <nav class="slide-strip sticky-bottom mt-3" aria-label="Pages and actions"
         th:with="first=${pageNumbers[0]}, last=${pageNumbers[pageNumbers.size() - 1]}">
        <div class="card shadow">
            <div class="card-body py-2 d-flex align-items-center gap-2">
                <th:block th:if="${pageCount > 1}">
                <a class="btn btn-outline-secondary btn-action" title="Previous (←)"
                   th:classappend="${prevPage == null} ? 'disabled'"
                   th:href="@{/sets/{id}/read(id=${set.id()},page=${prevPage ?: first})}"><i class="bi bi-chevron-left"></i></a>

                <div class="slide-thumbs d-flex align-items-center gap-2 flex-grow-1">
                    <th:block th:if="${previews[0] != first}">
                        <a class="slide-thumb slide-jump" th:href="@{/sets/{id}/read(id=${set.id()},page=${first})}"
                           th:title="'First page (' + ${first} + ')'" th:text="${first}">1</a>
                        <span class="text-body-secondary">…</span>
                    </th:block>

                    <a class="slide-thumb" th:each="n : ${previews}"
                       th:classappend="${shownNumbers.contains(n)} ? 'active'"
                       th:attr="aria-current=${shownNumbers.contains(n)} ? 'page' : null"
                       th:href="@{/sets/{id}/read(id=${set.id()},page=${n})}" th:title="'Page ' + ${n}">
                        <img loading="lazy" alt="" th:src="@{/sets/{id}/pages/{n}.png(id=${set.id()},n=${n})}"
                             onerror="this.remove()">
                        <span class="slide-num" th:text="${n}">1</span>
                    </a>

                    <th:block th:if="${previews[previews.size() - 1] != last}">
                        <span class="text-body-secondary">…</span>
                        <a class="slide-thumb slide-jump" th:href="@{/sets/{id}/read(id=${set.id()},page=${last})}"
                           th:title="'Last page (' + ${last} + ')'" th:text="${last}">12</a>
                    </th:block>
                </div>

                <span class="small text-body-secondary text-nowrap d-none d-sm-inline"
                      th:text="(${spread} ? ${shownNumbers[0]} + '–' + ${shownNumbers[1]} : ${page.number()}) + ' / ' + ${pageCount}">1 / 12</span>
                <a class="btn btn-outline-secondary btn-action" title="Next (→)"
                   th:classappend="${nextPage == null} ? 'disabled'"
                   th:href="@{/sets/{id}/read(id=${set.id()},page=${nextPage ?: last})}"><i class="bi bi-chevron-right"></i></a>
                </th:block>
                <div class="flex-grow-1" th:if="${pageCount <= 1}"></div>

                <!-- Actions -->
                <div class="vr mx-1"></div>
                <button class="btn btn-outline-primary btn-action position-relative" type="button" id="toggleWords"
                        aria-controls="wordSidebar" aria-expanded="false"
                        title="Show word list (W)" aria-label="Show word list">
                    <i class="bi bi-layout-sidebar-reverse"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-primary"
                          th:text="${wordCount}">0</span>
                </button>
                <button class="btn btn-outline-secondary btn-action" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#bgPicker" title="Background" aria-label="Choose background">
                    <i class="bi bi-image"></i></button>
                <a class="btn btn-outline-secondary btn-action" th:href="@{/sets/{id}(id=${set.id()})}"
                   title="Words in this set" aria-label="Words in this set"><i class="bi bi-list-ul"></i></a>
                <a class="btn btn-primary btn-action" th:href="@{/sets/{id}/learn(id=${set.id()})}"
                   title="Learn this set" aria-label="Learn this set"><i class="bi bi-lightning-charge"></i></a>
            </div>
        </div>
    </nav>
</main>

<th:block th:replace="~{layout :: background(false)}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script th:inline="javascript">
    const setId = /*[[${set.id()}]]*/ 0;
    const shownPages = /*[[${shownNumbers}]]*/ [1];
    const prevPage = /*[[${prevPage}]]*/ null;
    const nextPage = /*[[${nextPage}]]*/ null;
    const translations = {};
    const status = document.getElementById('status');
    // One entry per word and page; with two pages a word can be listed twice.
    const items = Array.from(document.querySelectorAll('.word-list li.word-item'));

    function itemFor(word) {
        return items.find(li => li.dataset.word === word);
    }

    function itemsFor(word) {
        return items.filter(li => li.dataset.word === word);
    }

    // ---- Word list sidebar: hidden by default, the choice is remembered between pages ----
    const readerRow = document.getElementById('readerRow');
    const toggleButton = document.getElementById('toggleWords');

    function sidebarOpen() {
        return !readerRow.classList.contains('words-hidden');
    }

    function setSidebar(open) {
        // The page image changes size, so any open tooltip would point at the wrong place.
        document.querySelectorAll('.box').forEach(box => bootstrap.Tooltip.getInstance(box)?.hide());
        readerRow.classList.toggle('words-hidden', !open);
        const badge = toggleButton.querySelector('.badge');
        badge.classList.toggle('text-bg-primary', !open);
        badge.classList.toggle('text-bg-light', open);
        toggleButton.setAttribute('aria-expanded', open);
        toggleButton.classList.toggle('active', open);
        const label = open ? 'Hide word list' : 'Show word list';
        toggleButton.title = label + ' (W)';
        toggleButton.setAttribute('aria-label', label);
        try { localStorage.setItem('readerWordList', open ? 'open' : 'hidden'); } catch (e) { /* storage blocked */ }
    }

    toggleButton.addEventListener('click', () => setSidebar(!sidebarOpen()));
    let savedSidebar = null;
    try { savedSidebar = localStorage.getItem('readerWordList'); } catch (e) { /* storage blocked */ }
    setSidebar(savedSidebar === 'open');

    // ---- Tooltips on the word boxes: the translation pops up on hover ----
    const boxes = Array.from(document.querySelectorAll('.box'));

    function addTooltips() {
        boxes.forEach(box => {
            const meaning = translations[box.dataset.word];
            if (!meaning) return;
            new bootstrap.Tooltip(box, {title: `${box.dataset.word} · ${meaning}`, placement: 'top', trigger: 'hover'});
        });
    }

    function select(word) {
        document.querySelectorAll('.active-word').forEach(el => el.classList.remove('active-word', 'list-group-item-primary'));
        document.querySelectorAll('.box.active').forEach(el => el.classList.remove('active'));
        boxes.forEach(box => bootstrap.Tooltip.getInstance(box)?.hide());
        const li = itemFor(word);
        if (!li) return;
        li.classList.add('active-word', 'list-group-item-primary');
        li.querySelector('.meaning').classList.remove('hidden');
        const matches = boxes.filter(box => box.dataset.word === word);
        matches.forEach(box => box.classList.add('active'));
        if (sidebarOpen()) {
            li.scrollIntoView({block: 'nearest'});
        }
        // Show the meaning on the page too, which is the only place it is visible when the list is hidden.
        if (matches.length > 0) {
            matches[0].scrollIntoView({block: 'nearest'});
            bootstrap.Tooltip.getInstance(matches[0])?.show();
        }
    }

    // ---- Saved words: shown as saved here and on every later page (the server knows the set's words) ----
    function isSaved(li) {
        return li.dataset.saved === 'true';
    }

    function markSaved(word) {
        itemsFor(word).forEach(li => {
            li.dataset.saved = 'true';
            const button = li.querySelector('.save');
            button.disabled = true;
            button.classList.replace('btn-outline-primary', 'btn-success');
            button.innerHTML = '<i class="bi bi-check-lg"></i> Saved';
        });
        boxes.filter(box => box.dataset.word === word).forEach(box => box.classList.add('saved'));
        updateSavedCount();
    }

    /** "n saved" counts each word once, even if it is on both pages. */
    function updateSavedCount() {
        const count = new Set(items.filter(isSaved).map(li => li.dataset.word)).size;
        const badge = document.getElementById('savedCount');
        badge.textContent = count + ' saved';
        badge.classList.toggle('d-none', count === 0);
    }
    updateSavedCount();

    items.forEach(li => {
        li.querySelector('.word').addEventListener('click', () => select(li.dataset.word));
        li.querySelector('.meaning').addEventListener('click', () => select(li.dataset.word));
        li.querySelector('.save').addEventListener('click', async event => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
                const response = await fetch(`/api/sets/${setId}/cards`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({word: li.dataset.word, translation: translations[li.dataset.word] || ''})
                });
                const body = await response.json();
                if (!response.ok) throw new Error(body.error || response.statusText);
                markSaved(li.dataset.word);
            } catch (error) {
                button.disabled = false;
                status.textContent = 'Could not save: ' + error.message;
            }
        });
    });
    boxes.forEach(box => box.addEventListener('click', () => select(box.dataset.word)));

    // Keyboard: ↑/↓ move through the words, ←/→ change page, Enter saves the selected word, W toggles the list.
    document.addEventListener('keydown', event => {
        if (event.target.closest('input, textarea, select, .offcanvas') || event.metaKey || event.ctrlKey || event.altKey) return;
        const current = items.findIndex(li => li.classList.contains('active-word'));
        switch (event.key) {
            case 'ArrowDown':
            case 'ArrowUp': {
                if (items.length === 0) return;
                event.preventDefault();
                const step = event.key === 'ArrowDown' ? 1 : -1;
                const next = current < 0
                    ? (step > 0 ? 0 : items.length - 1)
                    : Math.min(items.length - 1, Math.max(0, current + step));
                select(items[next].dataset.word);
                break;
            }
            case 'ArrowLeft':
            case 'ArrowRight': {
                // One page for landscape pages, two for portrait spreads (the server decides).
                const target = event.key === 'ArrowRight' ? nextPage : prevPage;
                if (target == null) return;
                event.preventDefault();
                location.href = `/sets/${setId}/read?page=${target}`;
                break;
            }
            case 'Enter': {
                if (event.target.closest('button, a')) return;   // the focused button handles Enter itself
                const save = current >= 0 && items[current].querySelector('.save');
                if (save && !save.disabled) { event.preventDefault(); save.click(); }
                break;
            }
            case 'w':
            case 'W':
                setSidebar(!sidebarOpen());
                break;
        }
    });

    if (items.length === 0) {
        status.textContent = '';
    } else {
        // Translations for every page shown (one or two), merged into one map.
        Promise.all(shownPages.map(n => fetch(`/api/sets/${setId}/pages/${n}/translations`)
            .then(async response => {
                const body = await response.json();
                if (!response.ok) throw new Error(body.error || response.statusText);
                return body;
            })))
            .then(maps => {
                const map = Object.assign({}, ...maps);
                Object.assign(translations, map);
                items.forEach(li => {
                    const meaning = map[li.dataset.word];
                    li.querySelector('.meaning').textContent = meaning || '(no translation)';
                    li.querySelector('.save').disabled = !meaning || isSaved(li);
                });
                addTooltips();
                status.textContent = 'Hover or click a word (or use ↑ ↓) to see its meaning, Enter to save it. ← → change page, W hides this list.';
            })
            .catch(error => { status.textContent = 'Translation failed: ' + error.message; });
    }
</script>
</body>
</html>
