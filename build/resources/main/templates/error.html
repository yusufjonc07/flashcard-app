<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Error')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{layout :: header}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <i class="bi bi-exclamation-octagon text-danger display-4"></i>
                    <h1 class="h4 mt-3"
                        th:text="'Something went wrong' + (${status != null} ? ' (' + ${status} + ')' : '')">Something went wrong</h1>
                    <p class="text-body-secondary" th:text="${message ?: error ?: 'Unexpected error'}">Details</p>
                    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house"></i> Back to home</a>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{layout :: background(true)}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
