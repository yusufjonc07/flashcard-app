<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${set.name()})}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{layout :: header}"></nav>
<main class="container pb-5">
    <div th:replace="~{layout :: flash}"></div>

    <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
        <h1 class="h3 mb-0 me-auto text-break" th:text="${set.name()}">Set</h1>
        <a class="btn btn-outline-secondary" th:if="${readable}" th:href="@{/sets/{id}/read(id=${set.id()})}">
            <i class="bi bi-book"></i> Read document</a>
        <a class="btn btn-primary" th:if="${summary.total() > 0}" th:href="@{/sets/{id}/learn(id=${set.id()})}">
            <i class="bi bi-lightning-charge"></i> Learn</a>
    </div>

    <!-- Summary -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold" th:text="${summary.total()}">0</div>
                <div class="small text-body-secondary">words</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold text-success" th:text="${summary.mastered()}">0</div>
                <div class="small text-body-secondary">mastered</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold text-warning-emphasis" th:text="${summary.learning()}">0</div>
                <div class="small text-body-secondary">learning</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold text-danger" th:text="${summary.highPriority()}">0</div>
                <div class="small text-body-secondary">high priority</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold text-secondary" th:text="${summary.fresh()}">0</div>
                <div class="small text-body-secondary">new</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100"><div class="card-body py-3">
                <div class="fs-4 fw-semibold" th:text="${summary.accuracyPercent()} + '%'">0%</div>
                <div class="small text-body-secondary">accuracy</div>
            </div></div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Add a word -->
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h6 card-title"><i class="bi bi-plus-circle me-1"></i> Add a word</h2>
                    <form method="post" th:action="@{/sets/{id}/words(id=${set.id()})}">
                        <div class="mb-2">
                            <label class="form-label small" for="word">Korean word</label>
                            <input class="form-control" type="text" id="word" name="word" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small" for="meaning">Meaning</label>
                            <input class="form-control" type="text" id="meaning" name="meaning"
                                   placeholder="Leave blank to translate">
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Add</button>
                    </form>
                    <hr>
                    <div class="small text-body-secondary mb-1" th:text="${summary.masteredPercent()} + '% mastered'">0%</div>
                    <div class="progress" role="progressbar" style="height: 6px">
                        <div class="progress-bar bg-success" th:style="'width:' + ${summary.masteredPercent()} + '%'"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Word list -->
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-body">
                    <form method="get" th:action="@{/sets/{id}(id=${set.id()})}">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input class="form-control" type="search" name="q" th:value="${q}"
                                   placeholder="Search words or meanings">
                            <a class="btn btn-outline-secondary" th:if="${!#strings.isEmpty(q)}"
                               th:href="@{/sets/{id}(id=${set.id()})}">Clear</a>
                            <button class="btn btn-outline-primary" type="submit">Search</button>
                        </div>
                    </form>
                </div>

                <div class="card-body text-center text-body-secondary py-5" th:if="${#lists.isEmpty(cards)}">
                    <i class="bi bi-journal-x fs-2"></i>
                    <p class="mt-2 mb-0"
                       th:text="${#strings.isEmpty(q)} ? 'No words in this set yet.' : 'No words match your search.'">No words.</p>
                </div>

                <div class="table-responsive" th:unless="${#lists.isEmpty(cards)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="text-body-secondary">#</th>
                            <th>Word</th>
                            <th>Meaning</th>
                            <th>Status</th>
                            <th class="text-nowrap">✓ / ✗</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="card, it : ${cards}">
                            <td class="text-body-secondary" th:text="${it.count}">1</td>
                            <td class="fw-semibold" th:text="${card.front()}">학교</td>
                            <td th:text="${card.translation()}">school</td>
                            <td><span class="badge" th:classappend="'status-' + ${card.status().name()}"
                                      th:text="${card.statusText()}">New</span></td>
                            <td class="text-body-secondary" th:text="${card.correct()} + ' / ' + ${card.incorrect()}">0 / 0</td>
                            <td class="text-end">
                                <form method="post"
                                      th:action="@{/sets/{id}/words/{cardId}/delete(id=${set.id()},cardId=${card.id()})}"
                                      onsubmit="return confirm('Delete this word?')">
                                    <button class="btn btn-sm btn-outline-danger" type="submit" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{layout :: background(true)}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
