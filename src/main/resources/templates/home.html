<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Home')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{layout :: header}"></nav>
<main class="container pb-5">
    <div th:replace="~{layout :: flash}"></div>

    <h1 class="h3 mb-4">My vocabulary sets</h1>

    <div class="row g-3 mb-4">
        <div class="col-12 col-lg-7">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h6 card-title"><i class="bi bi-upload me-1"></i> Open a document or import a word list</h2>
                    <form method="post" th:action="@{/upload}" enctype="multipart/form-data">
                        <div class="input-group">
                            <input class="form-control" type="file" name="file" required
                                   accept=".pdf,.ppt,.pptx,.png,.jpg,.jpeg,.tif,.tiff,.csv,.txt">
                            <button class="btn btn-primary" type="submit">Upload</button>
                        </div>
                    </form>
                    <div class="form-text">PDF, PPT(X) and images open in the reader. CSV/TXT word lists are imported as a set.</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-5">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h6 card-title"><i class="bi bi-plus-square me-1"></i> Create an empty set</h2>
                    <form method="post" th:action="@{/sets}">
                        <div class="input-group">
                            <input class="form-control" type="text" name="name" placeholder="Set name" required>
                            <button class="btn btn-outline-primary" type="submit">Create set</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-body-secondary py-5" th:if="${#lists.isEmpty(sets)}">
        <i class="bi bi-inbox fs-1"></i>
        <p class="mt-2">No sets yet. Upload a document to get started.</p>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="item : ${sets}">
            <div class="card h-100 shadow-sm" th:with="s=${item.summary()}">
                <div class="card-body">
                    <h2 class="h5 card-title text-truncate">
                        <a class="link-body-emphasis text-decoration-none"
                           th:href="@{/sets/{id}(id=${item.set().id()})}"
                           th:text="${item.set().name()}" th:title="${item.set().name()}">Set name</a>
                    </h2>
                    <div class="d-flex flex-wrap gap-1 mb-3 small">
                        <span class="badge text-bg-light border" th:text="${s.total()} + ' words'">0 words</span>
                        <span class="badge status-MASTERED" th:text="${s.mastered()} + ' mastered'">0</span>
                        <span class="badge status-LEARNING" th:text="${s.learning()} + ' learning'">0</span>
                        <span class="badge status-HIGH_PRIORITY" th:text="${s.highPriority()} + ' high priority'">0</span>
                        <span class="badge status-NEW" th:text="${s.fresh()} + ' new'">0</span>
                    </div>
                    <div class="d-flex justify-content-between small text-body-secondary mb-1">
                        <span th:text="${s.masteredPercent()} + '% mastered'">0% mastered</span>
                        <span th:text="'accuracy ' + ${s.accuracyPercent()} + '%'">accuracy 0%</span>
                    </div>
                    <div class="progress" role="progressbar" style="height: 6px"
                         th:attr="aria-valuenow=${s.masteredPercent()}" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-success" th:style="'width:' + ${s.masteredPercent()} + '%'"></div>
                    </div>
                </div>
                <div class="card-footer bg-body d-flex gap-2">
                    <a class="btn btn-sm btn-outline-secondary" th:if="${item.readable()}"
                       th:href="@{/sets/{id}/read(id=${item.set().id()})}"><i class="bi bi-book"></i> Read</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/sets/{id}(id=${item.set().id()})}">
                        <i class="bi bi-list-ul"></i> Words</a>
                    <a class="btn btn-sm btn-primary ms-auto" th:if="${s.total() > 0}"
                       th:href="@{/sets/{id}/learn(id=${item.set().id()})}"><i class="bi bi-lightning-charge"></i> Learn</a>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{layout :: background(true)}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
