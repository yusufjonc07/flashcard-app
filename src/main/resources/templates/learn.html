<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Learn ' + ${set.name()} + ' · Flashcards'">Learn</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <style>
        /* Only what Bootstrap has no component for: the flip card and the big round controls. */
        :root {
            --know: #6ad3c2;
            --know-bg: #234541;
            --dont: #e5574f;
            --dont-bg: #4a2523;
        }
        html, body { height: 100%; }
        body { background: #0c0c0c; }

        .counter-num {
            min-width: 54px; height: 54px; padding: 0 10px; border-radius: 27px;
            display: inline-grid; place-items: center; font-weight: 700; border: 3px solid;
        }
        .dont { color: var(--dont); }
        .know { color: var(--know); }
        .dont .counter-num { background: var(--dont-bg); border-color: var(--dont); }
        .know .counter-num { background: var(--know-bg); border-color: var(--know); }

        .stage { flex: 1; perspective: 2000px; min-height: 320px; }
        .flashcard {
            position: relative; width: 100%; height: 100%;
            transition: transform .45s ease; transform-style: preserve-3d; cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard.static { transition: none; cursor: default; }
        .face {
            position: absolute; inset: 0; border-radius: 28px; background: #1f2020;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 100px 40px 60px; text-align: center;
        }
        .face.back { transform: rotateY(180deg); }
        .word { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 700; word-break: keep-all; }
        .meaning { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 600; }
        .hint { letter-spacing: .15em; min-height: 1.6em; }
        .tools { position: absolute; top: 24px; right: 24px; }
        .btn-circle {
            width: 56px; height: 56px; border-radius: 50%; padding: 0;
            display: inline-grid; place-items: center; font-size: 1.35rem;
        }
        .btn-know { background: var(--know-bg); border: 3px solid var(--know); color: var(--know); }
        .btn-dont { background: var(--dont-bg); border: 3px solid var(--dont); color: var(--dont); }
        .btn-know:hover, .btn-know:focus-visible { background: var(--know); color: #08201c; border-color: var(--know); }
        .btn-dont:hover, .btn-dont:focus-visible { background: var(--dont); color: #fff; border-color: var(--dont); }
        .btn-teal { --bs-btn-bg: var(--know); --bs-btn-border-color: var(--know); --bs-btn-color: #08201c;
                    --bs-btn-hover-bg: #87dfd1; --bs-btn-hover-border-color: #87dfd1; --bs-btn-hover-color: #08201c; }
        .grade-bar { background: #1a1b1b; }
        .form-switch.big .form-check-input { width: 3.5em; height: 1.75em; cursor: pointer; }
        .typed .form-control { max-width: 420px; }
    </style>
</head>
<body class="d-flex flex-column gap-3 px-3 px-md-4 py-3"
      th:with="rs=${state.session}, result=${state.lastResult},
               card=${rs.isFinished() ? null : rs.current()},
               dontKnow=${rs.answered() - rs.correctAnswers()},
               done=${rs.total() - rs.remaining()}">

<!-- Top bar: session counters -->
<div class="d-flex align-items-center justify-content-between gap-3">
    <div class="dont d-flex align-items-center gap-2 fs-5 fw-semibold">
        <span class="counter-num" th:text="${dontKnow}">0</span> <span class="d-none d-sm-inline">Don't Know</span>
    </div>
    <a class="link-secondary link-underline-opacity-0 small text-truncate"
       th:href="@{/sets/{id}(id=${set.id()})}"><i class="bi bi-arrow-left"></i> <span th:text="${set.name()}">set</span></a>
    <div class="know d-flex align-items-center gap-2 fs-5 fw-semibold">
        <span class="d-none d-sm-inline">Know</span> <span class="counter-num" th:text="${rs.correctAnswers()}">0</span>
    </div>
</div>

<div class="alert alert-danger py-2 mb-0 text-center" th:if="${error != null}" th:text="${error}">error</div>

<div class="stage">

    <!-- 1. Result of a typed answer: the card shows its back; Enter moves on. -->
    <div class="flashcard flipped static" th:if="${result != null}">
        <div class="face"></div>
        <div class="face back">
            <div class="fs-5 fw-bold mb-3" th:classappend="${result.correct()} ? 'know' : 'dont'">
                <i class="bi" th:classappend="${result.correct()} ? 'bi-check-circle' : 'bi-x-circle'"></i>
                <span th:text="${result.correct()} ? 'Correct!' : 'Not quite'">Correct!</span>
            </div>
            <div class="word" th:text="${result.before().front()}">학교</div>
            <div class="meaning mt-2" th:text="${result.expected()}">school</div>
            <div class="text-body-secondary mt-3" th:if="${!result.correct()}"
                 th:text="'You answered: ' + (${#strings.isEmpty(result.given())} ? '(blank)' : ${result.given()})">x</div>
            <div class="know mt-2" th:if="${result.justMastered()}"><i class="bi bi-trophy"></i> Mastered!</div>
            <form class="mt-4" method="post" th:action="@{/sets/{id}/learn/next(id=${set.id()})}">
                <button class="btn btn-teal btn-lg px-4" id="next" type="submit" autofocus>
                    Next <i class="bi bi-arrow-return-left"></i></button>
            </form>
        </div>
    </div>

    <!-- 2. Session finished. -->
    <div class="flashcard static" th:if="${result == null and rs.isFinished()}">
        <div class="face">
            <div class="word" th:text="${rs.total() == 0} ? 'Nothing to review' : 'Session complete 🎉'">Done</div>
            <div class="text-body-secondary mt-3" th:if="${rs.total() == 0}">
                Every word in this set is mastered, or the set is empty.</div>
            <div class="text-body-secondary mt-3" th:unless="${rs.total() == 0}"
                 th:text="${rs.answered()} + ' answers · ' + ${rs.correctAnswers()} + ' known · '
                          + ${rs.masteredThisSession()} + ' newly mastered'">summary</div>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                <form method="post" th:action="@{/sets/{id}/learn/restart(id=${set.id()})}">
                    <button class="btn btn-teal btn-lg" type="submit"><i class="bi bi-arrow-repeat"></i> Start again</button>
                </form>
                <form method="post" th:action="@{/sets/{id}/learn/restart(id=${set.id()},shuffle=true)}">
                    <button class="btn btn-outline-light btn-lg" type="submit"><i class="bi bi-shuffle"></i> Shuffle &amp; start</button>
                </form>
                <a class="btn btn-outline-light btn-lg" th:href="@{/sets/{id}(id=${set.id()})}">
                    <i class="bi bi-list-ul"></i> Back to words</a>
            </div>
        </div>
    </div>

    <!-- 3. A card to study: click or Space to flip. -->
    <div class="flashcard" id="card" th:if="${card != null and result == null}">
        <div class="face front">
            <div class="tools d-flex gap-2">
                <button class="btn btn-outline-secondary rounded-pill px-4 text-light" type="button" id="hintBtn" title="Hint (H)">
                    <i class="bi bi-lightbulb"></i> <span class="d-none d-sm-inline">Get a hint</span></button>
                <button class="btn btn-outline-secondary btn-circle text-light" type="button" id="speakBtn" title="Pronounce (S)">
                    <i class="bi bi-volume-up"></i></button>
                <button class="btn btn-outline-secondary btn-circle text-light" type="button" id="editBtn" title="Edit meaning (E)"
                        data-bs-toggle="modal" data-bs-target="#editModal">
                    <i class="bi bi-pencil"></i></button>
            </div>
            <div class="word" th:text="${card.front()}">획득하다</div>
            <span class="badge mt-3" th:classappend="'status-' + ${card.status().name()}"
                  th:text="${card.statusText()}">New</span>
            <div class="hint text-body-secondary fs-5 mt-3" id="hint"></div>
            <form class="typed w-100 d-flex justify-content-center gap-2 mt-4 d-none" id="typed"
                  method="post" th:action="@{/sets/{id}/learn/answer(id=${set.id()})}">
                <input class="form-control form-control-lg" type="text" name="answer" id="answer"
                       placeholder="Type the meaning…" autocomplete="off">
                <button class="btn btn-teal btn-lg" type="submit">Check</button>
            </form>
        </div>
        <div class="face back">
            <div class="meaning" th:text="${card.translation()}">to acquire</div>
            <div class="text-body-secondary mt-3" th:text="${card.front()}">획득하다</div>
        </div>
    </div>
</div>

<!-- Bottom bar -->
<div class="row g-3 align-items-center">
    <div class="col-12 col-md-4 order-2 order-md-1 d-flex justify-content-center justify-content-md-start">
        <div class="form-check form-switch big d-flex align-items-center gap-3 fs-5 fw-semibold mb-0">
            <input class="form-check-input mt-0" type="checkbox" role="switch" id="typeSwitch">
            <label class="form-check-label" for="typeSwitch">Type answers</label>
        </div>
    </div>

    <div class="col-12 col-md-4 order-1 order-md-2 d-flex justify-content-center">
        <div class="grade-bar d-flex align-items-center gap-4 rounded-pill px-4 py-2">
            <form method="post" th:action="@{/sets/{id}/learn/grade(id=${set.id()})}">
                <input type="hidden" name="knew" value="false">
                <button class="btn btn-circle btn-dont" type="submit" id="noBtn" title="Don't know (←)"
                        th:disabled="${card == null or result != null}"><i class="bi bi-x-lg"></i></button>
            </form>
            <span class="fs-4 fw-bold text-center" style="min-width: 80px"
                  th:text="${rs.total() == 0} ? '0/0' : (${done < rs.total() ? done + 1 : rs.total()} + '/' + ${rs.total()})">1/44</span>
            <form method="post" th:action="@{/sets/{id}/learn/grade(id=${set.id()})}">
                <input type="hidden" name="knew" value="true">
                <button class="btn btn-circle btn-know" type="submit" id="yesBtn" title="Know (→)"
                        th:disabled="${card == null or result != null}"><i class="bi bi-check-lg"></i></button>
            </form>
        </div>
    </div>

    <div class="col-12 col-md-4 order-3 d-flex justify-content-center justify-content-md-end gap-2">
        <form method="post" th:action="@{/sets/{id}/learn/undo(id=${set.id()})}">
            <button class="btn btn-dark btn-circle" type="submit" id="undoBtn" title="Undo (Z)"
                    th:disabled="${!rs.canUndo()}"><i class="bi bi-arrow-counterclockwise"></i></button>
        </form>
        <form method="post" th:action="@{/sets/{id}/learn/restart(id=${set.id()},shuffle=true)}"
              onsubmit="return confirm('Shuffle and start a new session?')">
            <button class="btn btn-dark btn-circle" type="submit" title="Shuffle and restart"><i class="bi bi-shuffle"></i></button>
        </form>
        <button class="btn btn-dark btn-circle" type="button" id="fullBtn" title="Fullscreen (F)">
            <i class="bi bi-arrows-fullscreen"></i></button>
    </div>
</div>
<div class="text-center small text-body-secondary d-none d-md-block">
    <kbd>Space</kbd> flip · <kbd>←</kbd> don't know · <kbd>→</kbd> know · <kbd>H</kbd> hint ·
    <kbd>S</kbd> speak · <kbd>E</kbd> edit · <kbd>Z</kbd> undo · <kbd>F</kbd> fullscreen
</div>

<!-- Edit meaning -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true"
     th:if="${card != null and result == null}">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" method="post" th:action="@{/sets/{id}/learn/edit(id=${set.id()})}">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="editTitle" th:text="'Edit meaning of ' + ${card.front()}">Edit</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="cardId" th:value="${card.id()}">
                <input class="form-control form-control-lg" type="text" name="meaning" id="editMeaning"
                       th:value="${card.translation()}" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-teal">Save</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
<script th:inline="javascript">
    const word = /*[[${card != null ? card.front() : ''}]]*/ '';
    const meaning = /*[[${card != null ? card.translation() : ''}]]*/ '';
    const $ = id => document.getElementById(id);
    const card = $('card');
    const typed = $('typed');
    const typeSwitch = $('typeSwitch');
    const editModal = $('editModal');
    let hintLevel = 0;

    function flip() {
        if (card) card.classList.toggle('flipped');
    }

    function hint() {
        if (!card || !meaning) return;
        hintLevel = Math.min(hintLevel + 1, meaning.length);
        $('hint').textContent = meaning.slice(0, hintLevel)
            + meaning.slice(hintLevel).replace(/\S/g, '_');
    }

    function speak() {
        if (!word || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'ko-KR';
        speechSynthesis.speak(utterance);
    }

    function setTyping(on) {
        typeSwitch.checked = on;
        if (typed) {
            typed.classList.toggle('d-none', !on);
            if (on) $('answer').focus();
        }
        try { localStorage.setItem('typeAnswers', on ? '1' : '0'); } catch (e) { /* storage blocked */ }
    }

    function fullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen?.();
    }

    function click(id) {
        const button = $(id);
        if (button && !button.disabled) button.click();
    }

    if (card) {
        card.addEventListener('click', event => {
            if (!event.target.closest('button, input, form')) flip();
        });
        $('hintBtn').addEventListener('click', hint);
        $('speakBtn').addEventListener('click', speak);
    }
    if (editModal) {
        editModal.addEventListener('shown.bs.modal', () => $('editMeaning').select());
    }
    typeSwitch.addEventListener('change', () => setTyping(typeSwitch.checked));
    $('fullBtn').addEventListener('click', fullscreen);

    let typingSaved = false;
    try { typingSaved = localStorage.getItem('typeAnswers') === '1'; } catch (e) { /* storage blocked */ }
    setTyping(typingSaved);

    document.addEventListener('keydown', event => {
        if (event.target.closest('input, .modal') || event.metaKey || event.ctrlKey || event.altKey) return;
        switch (event.key) {
            case ' ': event.preventDefault(); flip(); break;
            case 'ArrowLeft': click('noBtn'); break;
            case 'ArrowRight': click('yesBtn'); break;
            case 'Enter': click('next'); break;
            case 'h': case 'H': hint(); break;
            case 's': case 'S': speak(); break;
            case 'e': case 'E':
                if (editModal) { event.preventDefault(); bootstrap.Modal.getOrCreateInstance(editModal).show(); }
                break;
            case 'z': case 'Z': click('undoBtn'); break;
            case 'f': case 'F': fullscreen(); break;
        }
    });
</script>
</body>
</html>
