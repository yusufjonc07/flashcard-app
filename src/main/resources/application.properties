spring.application.name=flashcard-app
server.port=8080

# SQLite file in data/ (the desktop app moves it with -Dflashcards.data=...). One connection: SQLite allows one writer at a time.
spring.datasource.url=jdbc:sqlite:${flashcards.data:data}/flashcards.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Lecture PDFs can be large.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Review sessions live in memory only; progress itself is always in the database.
server.servlet.session.persistent=false
server.servlet.session.timeout=4h
# Sessions use a cookie only, never ";jsessionid=..." in URLs (that would leak the session in links).
server.servlet.session.tracking-modes=cookie

# Translation target language (overridable with the TRANSLATE_TARGET_LANGUAGE env variable).
TRANSLATE_TARGET_LANGUAGE=en

spring.thymeleaf.cache=false
